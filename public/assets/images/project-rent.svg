<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Main Portal Card Preview -->
  <g transform="translate(60, 40)" filter="url(#cardShadow)">
    <!-- Browser/Card Frame -->
    <rect width="680" height="370" rx="12" fill="#111827" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="680" height="36" rx="12" fill="#1f2937" />
    <rect y="24" width="680" height="12" fill="#1f2937" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="340" y="23" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" text-anchor="middle">Bekoe Rental Property &amp; Tenancy Management — Adenta New Site</text>

    <!-- Header Inside Card -->
    <rect x="25" y="55" width="630" height="70" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(56, 189, 248, 0.2)" />
    <text x="45" y="85" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="16" font-weight="700">Richard Bekoe Residential Rentals</text>
    <text x="45" y="108" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12">Adenta New Site, behind WASHS &bull; Verified Database &amp; Public Room Catalog</text>
    
    <!-- Badge -->
    <rect x="525" y="70" width="115" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
    <circle cx="540" cy="83" r="4" fill="#10b981" />
    <text x="550" y="87" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600">LIVE PORTAL</text>

    <!-- Room 1 Card -->
    <g transform="translate(25, 145)">
      <rect width="195" height="200" rx="8" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" />
      <rect width="195" height="95" rx="8" fill="#334155" />
      <rect y="83" width="195" height="12" fill="#334155" />
      <!-- Room icon / illustration -->
      <path d="M 70 70 L 97 45 L 125 70 Z" fill="#64748b" />
      <rect x="80" y="65" width="35" height="25" fill="#475569" />
      <text x="15" y="120" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="600">Self-Contained Suite</text>
      <text x="15" y="140" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">Private Bath &bull; Metered</text>
      <rect x="15" y="155" width="70" height="20" rx="4" fill="rgba(59, 130, 246, 0.2)" />
      <text x="22" y="169" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600">Available</text>
      <!-- Action button -->
      <rect x="100" y="155" width="80" height="24" rx="4" fill="#2563eb" />
      <text x="140" y="171" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600" text-anchor="middle">Book View</text>
    </g>

    <!-- Room 2 Card -->
    <g transform="translate(242, 145)">
      <rect width="195" height="200" rx="8" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)" />
      <rect width="195" height="95" rx="8" fill="#334155" />
      <rect y="83" width="195" height="12" fill="#334155" />
      <path d="M 70 70 L 97 45 L 125 70 Z" fill="#64748b" />
      <rect x="80" y="65" width="35" height="25" fill="#475569" />
      <text x="15" y="120" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="600">Standard Single Room</text>
      <text x="15" y="140" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">Shared Facilities &bull; Clean</text>
      <rect x="15" y="155" width="70" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" />
      <text x="22" y="169" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600">Inspected</text>
      <rect x="100" y="155" width="80" height="24" rx="4" fill="#2563eb" />
      <text x="140" y="171" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600" text-anchor="middle">Book View</text>
    </g>

    <!-- Feature / Admin Highlights Card -->
    <g transform="translate(460, 145)">
      <rect width="195" height="200" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" />
      <text x="15" y="30" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="700">SYSTEM ARCHITECTURE</text>
      <text x="15" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">&bull; Next.js 14+ App Router</text>
      <text x="15" y="78" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">&bull; Prisma ORM / PostgreSQL</text>
      <text x="15" y="101" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">&bull; WhatsApp Click-to-Chat</text>
      <text x="15" y="124" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">&bull; Owner Tenancy Dashboard</text>
      <text x="15" y="147" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">&bull; ID Uploads &amp; Lease Records</text>
      <rect x="15" y="165" width="165" height="24" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" />
      <text x="97" y="181" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600" text-anchor="middle">100% Real-World Business</text>
    </g>
  </g>
</svg>
