<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="solarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentSolar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="solarGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#solarBg)" />

  <g opacity="0.15" stroke="#34d399" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Main Telemetry Dashboard Window -->
  <g transform="translate(60, 40)" filter="url(#solarGlow)">
    <rect width="680" height="370" rx="12" fill="#091b15" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5" />
    
    <!-- Title bar -->
    <rect width="680" height="36" rx="12" fill="#0d2820" />
    <rect y="24" width="680" height="12" fill="#0d2820" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="340" y="23" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" text-anchor="middle">ARSPCS — Autonomous Robotic Solar Panel Cleaning Simulation</text>

    <!-- Top Status Banner -->
    <g transform="translate(25, 52)">
      <rect width="630" height="60" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(52, 211, 153, 0.2)" />
      <text x="20" y="27" fill="#f0fdf4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="700">Autonomous Solar Robot Simulation</text>
      <text x="20" y="47" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">Physics-Based Telemetry &bull; Dust Soiling Degradation &bull; Battery State Machine</text>
      
      <rect x="510" y="17" width="105" height="26" rx="13" fill="rgba(52, 211, 153, 0.2)" stroke="#34d399" />
      <circle cx="525" cy="30" r="4" fill="#34d399" />
      <text x="535" y="34" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600">SYSTEM: ACTIVE</text>
    </g>

    <!-- 4 Telemetry Metrics Cards -->
    <g transform="translate(25, 125)">
      <!-- Metric 1: State -->
      <rect x="0" y="0" width="145" height="90" rx="8" fill="#0c231c" stroke="rgba(52, 211, 153, 0.2)" />
      <text x="15" y="25" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600">ROBOT STATE</text>
      <text x="15" y="55" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="18" font-weight="700">CLEANING</text>
      <text x="15" y="75" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10">State Machine v2.4</text>

      <!-- Metric 2: Battery -->
      <rect x="160" y="0" width="145" height="90" rx="8" fill="#0c231c" stroke="rgba(52, 211, 153, 0.2)" />
      <text x="175" y="25" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600">BATTERY SOC</text>
      <text x="175" y="55" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="18" font-weight="700">87.4%</text>
      <text x="175" y="75" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10">Degradation: Nominal</text>

      <!-- Metric 3: Soiling Index -->
      <rect x="320" y="0" width="145" height="90" rx="8" fill="#0c231c" stroke="rgba(52, 211, 153, 0.2)" />
      <text x="335" y="25" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600">SOILING REDUCTION</text>
      <text x="335" y="55" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="18" font-weight="700">-34.2%</text>
      <text x="335" y="75" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10">Clean Efficiency: 96%</text>

      <!-- Metric 4: Climate -->
      <rect x="480" y="0" width="150" height="90" rx="8" fill="#0c231c" stroke="rgba(52, 211, 153, 0.2)" />
      <text x="495" y="25" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600">ENVIRONMENT</text>
      <text x="495" y="55" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="18" font-weight="700">32.8 &deg;C</text>
      <text x="495" y="75" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10">Tropical Arid Climate</text>
    </g>

    <!-- Bottom Chart / Architecture Panel -->
    <g transform="translate(25, 230)">
      <rect width="630" height="115" rx="8" fill="#061812" stroke="rgba(52, 211, 153, 0.2)" />
      <text x="20" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="700">SIMULATION TELEMETRY TRACE (PYTHON &amp; MATPLOTLIB AUTOMATION)</text>
      
      <!-- Sparkline curve -->
      <path d="M 30 90 Q 100 40 180 75 T 320 50 T 460 80 T 580 35 L 610 45" fill="none" stroke="#34d399" stroke-width="2.5" />
      <circle cx="610" cy="45" r="4" fill="#34d399" />
      
      <text x="30" y="105" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9.5">State Transitions: IDLE &rarr; DEPLOY &rarr; TRAVERSE_ROW &rarr; BRUSH_PANEL &rarr; DOCK &rarr; RECHARGE</text>
      <text x="470" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10">Python 3 &bull; Test Suite Verified</text>
    </g>
  </g>
</svg>
